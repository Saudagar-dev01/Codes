<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Block vs Inline Elements</title>
    </head>
    <body>

        <h1>Block vs Inline Elements</h1>

        <div>
            <h2>Block Elements</h2>
            <p>Block elements always start on a new line </p>
            <p>Examples of block elements are div, p, h1-h6</p>
        </div>      

        <h2>Inline Elements</h2>
        <p>Inline elements remain on the<span style="color: blue;"> same line </span></p>
        <p>Examples of inline elements are <b>Bold</b>, <i>Italic</i>, <u>Underline</u></p>

    </body>
</html>
